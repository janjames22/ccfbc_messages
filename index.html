<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpg" href="/src/assets/logo-ccfbc.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabanatuan Community of Faith Baptist Church</title>
    <meta name="description" content="Review, remember, and reflect on the Word of God shared every week at Cabanatuan Community of Faith Baptist Church." />
    
    <!-- PWA / Mobile Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CCFBC" />
    <link rel="apple-touch-icon" href="/icon-192.jpg" />
    <meta name="theme-color" content="#1e88e5" />
    <script>
      window.addEventListener('error', async function(e) {
        console.error('Global error caught:', e.error);
        if ('serviceWorker' in navigator) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            let cleared = false;
            for (let r of regs) { await r.unregister(); cleared = true; }
            if (cleared) {
              console.log('Cleared SW due to fatal error, reloading...');
              sessionStorage.setItem('ccfbc_sw_cleared', 'true');
              if (!sessionStorage.getItem('ccfbc_reloaded')) {
                sessionStorage.setItem('ccfbc_reloaded', 'true');
                window.location.reload(true);
              }
            }
          } catch(err) {}
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
